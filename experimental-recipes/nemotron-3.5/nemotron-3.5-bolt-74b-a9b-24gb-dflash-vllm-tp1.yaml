recipe_version: "2"
min_sparkrun_version: "0.4.0"
model: nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB
model_revision: c6cc2e8ffa353403213d6b9b18aaf8eb684d705a
runtime: vllm
# The upstream nightly named by the model card, pinned by index digest. The
# spark-arena B12X image (fork vLLM 8244d1c4) lacks the LiLiCorr drafter.
container: vllm/vllm-openai:nightly-77154ca6116ae34cbfe314beef1016bde9b63989@sha256:a7deff2c216def98c193352aca50fb03a2ee29231355b3033dc3789009f6d23e
max_nodes: 1

metadata:
  description: >-
    Experimental Nemotron 3.5 Bolt 74B-A9B (24 GB packed: NVFP4 linears,
    IQ2_XXS experts) on one DGX Spark: b12x linear/MoE, 256K context,
    LiLiCorr DFlash k=7. Adapts NVIDIA's model-card vLLM recipe.
  model_url: https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB
  model_params: "74B"
  kv_dtype: fp8

# Installs the b12x wheel the image imports but does not ship.
mods:
  - b12x-1.5.1

# The image's ENTRYPOINT is ["vllm", "serve"], which would consume sparkrun's
# command as its own arguments.
executor_config:
  entrypoint: ""

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  trust_remote_code: true
  max_model_len: 262144
  max_num_seqs: 10
  max_num_batched_tokens: 4096
  enable_chunked_prefill: true
  # instanttensor 0.2.2 ships in the image; the drafter keeps load_format auto.
  load_format: instanttensor
  kv_cache_dtype: fp8
  linear_backend: b12x
  moe_backend: b12x
  attention_backend: FLASHINFER
  mamba_backend: flashinfer
  mamba_ssm_cache_dtype: bfloat16
  mamba_cache_dtype: bfloat16
  mamba_cache_mode: align
  seed: 42
  limit_mm_per_prompt: {video: 1, image: 1}
  video_pruning_rate: 0.5
  media_io_kwargs: {video: {fps: 2, num_frames: 256}}
  enable_auto_tool_choice: true
  tool_call_parser: qwen3_coder
  # The parser ships in the model repo; the in-container snapshot path is
  # rendered into the env below and expanded by the serve shell.
  reasoning_parser_plugin: $NEMOTRON_REASONING_PARSER_PLUGIN
  reasoning_parser: ultra_v3
  speculative_config:
    method: dflash
    model: nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB-LiLiCorr
    revision: 4c6a5613b6d887194a3a5493e3a18a5b3930bb86
    num_speculative_tokens: 7
    rejection_sample_method: standard
    attention_backend: FLASHINFER
    draft_load_config: {load_format: auto}

env:
  VLLM_USE_V2_MODEL_RUNNER: "1"
  NEMOTRON_REASONING_PARSER_PLUGIN: "{launch.model_path}/ultra_v3_reasoning_parser.py"
